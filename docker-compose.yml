version: '3.8'

services:
  app:
    build: .
    container_name: workout_backend
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - venv_data:/app/.venv
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/workout_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_key_at_least_32_chars_long_12345
      - ALGORITHM=HS256
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: workout_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: workout_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  venv_data: